const hitW=(x,y)=>walls.some(w=>x+14>w.x&&x-14<w.x+w.w&&y+9>G-w.h);

function bubble(t,x,by){ctx.font='bold 20px system-ui,Arial';ctx.textAlign='center';
  const tw=ctx.measureText(t).width+28,bx=x-tw/2,bh=38;
  ctx.fillStyle='#fff';ctx.strokeStyle='#222';ctx.lineWidth=3;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,tw,bh,12);else ctx.rect(bx,by,tw,bh);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-9,by+bh);ctx.lineTo(x,by+bh+16);ctx.lineTo(x+9,by+bh);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillRect(x-7,by+bh-1.5,14,4);
  ctx.fillStyle='#222';ctx.fillText(t,x,by+26)}
function kp(t){if(dying>0)return;dying=DYING;msg=DYING;dmsg=t;speak(PHRASE);p.air=false;p.t=0;p.vy=0;p.y=G}
function reset(){dying=0;p.x=0;p.y=G;p.vy=0;p.jumps=0;p.jumpReq=0;p.air=false}

function speak(t){if(!snd)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let AC=null;
let unlocked=false;
function audio(){try{
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)()}
  if(AC.state!=='running')AC.resume();
  if(!unlocked){unlocked=true;const b=AC.createBuffer(1,1,22050),sr=AC.createBufferSource();sr.buffer=b;sr.connect(AC.destination);sr.start(0);
    try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
  return AC}catch(e){return null}}
const unlock=()=>{audio();musicStart()};
['pointerdown','touchstart','touchend','click','keydown'].forEach(n=>addEventListener(n,unlock,{passive:true}));
function sfxShot(){if(!snd)return;const a=audio();if(!a)return;const t=a.currentTime;
  const len=Math.floor(a.sampleRate*.12),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const n=a.createBufferSource();n.buffer=buf;const g=a.createGain(),f=a.createBiquadFilter();
  f.type='highpass';f.frequency.value=800;g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
  n.connect(f);f.connect(g);g.connect(a.destination);n.start(t);
  const o=a.createOscillator(),og=a.createGain();o.type='square';
  o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(70,t+.12);
  og.gain.setValueAtTime(.12,t);og.gain.exponentialRampToValueAtTime(.001,t+.13);
  o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+.14)}

let mg=null,mTimer=null,nextT=0,mstep=0,noiseBuf=null;
const M1={bpm:132,bass:[48,53,55,48],mel:[76,79,84,79,76,79,84,0, 77,81,84,81,77,81,84,0, 79,83,79,76,79,83,86,0, 74,77,81,77,74,72,67,0]};
const M2={bpm:150,bass:[45,43,41,40],mel:[81,0,76,0,72,76,81,0, 79,0,74,0,71,74,79,0, 77,0,72,0,69,72,77,0, 76,0,71,0,68,71,76,0]};
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(type,fr,t,dur,vol){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=fr;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.02)}
function hat(t){const a=AC;if(!noiseBuf){noiseBuf=a.createBuffer(1,Math.floor(a.sampleRate*.05),a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=noiseBuf;f.type='highpass';f.frequency.value=6000;
  g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);n.connect(f);f.connect(g);g.connect(mg);n.start(t)}
function sched(){const a=AC;if(!a||!mg)return;const Z=lvl>=5?M2:M1,spb=60/Z.bpm/2,offs=[0,0,12,0,0,0,12,0];
  while(nextT<a.currentTime+.15){const i=mstep%32,r=Z.bass[Math.floor(i/8)];
    if(Z.mel[i])tone('square',mf(Z.mel[i]),nextT,spb*.85,.35);
    tone('triangle',mf(r+offs[i%8]),nextT,spb*.9,.8);
    if(i%2)hat(nextT);
    nextT+=spb;mstep++}}
function musicStart(){if(!musicOn||mTimer)return;const a=audio();if(!a)return;
  if(!mg){mg=a.createGain();mg.gain.value=.11;mg.connect(a.destination)}
  nextT=a.currentTime+.05;mstep=0;mTimer=setInterval(sched,30)}
function musicStop(){clearInterval(mTimer);mTimer=null}
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicStop();else if(AC)musicStart()});
function die(){deaths++;msg=0;load()}
const rnd=n=>{const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v)};

function update(){
  if(inMenu)return;
  if(dying>0){if(--dying===0)die();return}
  const HW=face?13:11;
  if(msg>0)msg--;
  if(win>0){if(--win===0){
    if(lvl>=LV.length-1){lvl=0;load();started=false;note='🏆 ¡Completaste los '+LV.length+' niveles!';openMenu('main')}
    else{lvl++;load()}}return}
  const m=(k.d?1:0)-(k.a?1:0);
  const nx=Math.max(0,p.x+m*4);
  if(!walls.some(w=>nx+HW>w.x&&nx-HW<w.x+w.w&&p.y>G-w.h+1))p.x=nx;
  if(m){p.dir=m;p.t+=0.25}else p.t=0;
  if(p.jumpReq>0){
    if(p.jumps<2){p.vy=p.jumps?-12:-13;p.jumps++;p.jumpReq=0;p.coyote=0}
    else p.jumpReq--;
  }
  const py=p.y;p.vy+=0.65;p.y+=p.vy;
  let ground=G;
  for(const w of walls)if(p.x+HW>w.x&&p.x-HW<w.x+w.w&&py<=G-w.h&&p.y>=G-w.h)ground=Math.min(ground,G-w.h);
  const landed=p.y>=ground;
  if(landed){p.y=ground;p.vy=0;p.jumps=0;p.coyote=6}
  else if(p.coyote>0)p.coyote--;
  else if(p.jumps===0)p.jumps=1;
  p.air=!landed;
  for(const q of spikes)if(p.y>G-22&&p.x+7>q.x&&p.x-7<q.x+q.n*SP){kp('¡Pinchos! Reiniciando…');return}
  if(cool>0)cool--;if(flash>0)flash--;
  if(k.e&&cool===0){bullets.push({x:p.x+p.dir*24,y:p.y-34,d:p.dir,l:70});cool=14;flash=4;sfxShot()}
  for(const b of bullets){b.x+=b.d*10;b.l--;
    if(walls.some(w=>b.x>w.x&&b.x<w.x+w.w&&b.y>G-w.h))b.l=0;
    for(const bd of birds)if(bd.alive&&b.l>0&&Math.abs(b.x-bd.x)<22&&Math.abs(b.y-bd.y)<20){bd.alive=false;b.l=0;puffs.push({x:bd.x,y:bd.y,t:0})}}
  bullets=bullets.filter(b=>b.l>0);
  for(const u of puffs)u.t++;puffs=puffs.filter(u=>u.t<16);
  for(const bd of birds){if(!bd.alive)continue;bd.t+=.15;
    const tx=p.x,ty=p.y-38,dx=tx-bd.x,dy=ty-bd.y,d=Math.hypot(dx,dy);bd.f=dx>=0?1:-1;
    if(d<420){
      const nx=bd.x+dx/d*2.2,ny=bd.y+dy/d*2.2+Math.sin(bd.t*2)*.8;
      if(!hitW(nx,bd.y)){bd.x=nx;if(!hitW(bd.x,ny))bd.y=Math.min(ny,G-14)}   // libre: avanza
      else bd.y-=2.2;                                                          // pared adelante: sube para pasar por arriba
    }else bd.y=bd.y0+Math.sin(bd.t)*10;
    if(d<26){kp('¡Un pájaro te atrapó! Reiniciando…');return}}
  if(p.x>=GOAL){win=120;speak(WINP);if(lvl+1<LV.length&&lvl+1>best){best=lvl+1;save()}}
}

function draw(){
  ctx.setTransform(cs,0,0,cs,0,0);
  const cam=p.x-W/2,z2=lvl>=5;
  // cielo
  if(z2){const gr=ctx.createLinearGradient(0,0,0,G);gr.addColorStop(0,'#5c0a0a');gr.addColorStop(1,'#d62828');ctx.fillStyle=gr}else ctx.fillStyle='#8ecae6';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle=z2?'#ffb4a2':'#ffd166';ctx.beginPath();ctx.arc(680,70,36,0,7);ctx.fill();
  // nubes (parallax)
  ctx.fillStyle=z2?'rgba(50,5,5,.55)':'rgba(255,255,255,.85)';
  for(let i=-1;i<8;i++){
    const x=((i*220-cam*0.3)%1760+1760)%1760-200,y=50+rnd(i)*80;
    ctx.beginPath();ctx.ellipse(x,y,45,16,0,0,7);ctx.ellipse(x+25,y-10,30,14,0,0,7);ctx.fill();
  }
  // tierra
  ctx.fillStyle=z2?'#4a2118':'#7b4a24';ctx.fillRect(0,G,W,H-G);
  const s=Math.floor(cam/40)-1;
  for(let i=s;i<s+23;i++){
    const x=i*40-cam;
    ctx.fillStyle='#5e3718';
    ctx.beginPath();ctx.arc(x+rnd(i)*40,G+20+rnd(i+9)*50,3+rnd(i+3)*4,0,7);ctx.fill();
    ctx.fillStyle='#946036';
    ctx.beginPath();ctx.arc(x+rnd(i+5)*40,G+15+rnd(i+2)*55,2+rnd(i+7)*3,0,7);ctx.fill();
  }
  // pasto
  ctx.fillStyle=z2?'#9d1c1c':'#4caf50';ctx.fillRect(0,G,W,8);
  // paredes
  for(const w of walls){const x=w.x-cam;if(x<-60||x>W+20)continue;
    ctx.fillStyle=z2?'#4a2118':'#7b4a24';ctx.fillRect(x,G-w.h,w.w,w.h);
    ctx.fillStyle='#5e3718';for(let y=G-w.h+20;y<G;y+=30)ctx.fillRect(x+6+(y%20),y,8,6);
    ctx.fillStyle=z2?'#9d1c1c':'#4caf50';ctx.fillRect(x,G-w.h,w.w,8)}
  // pinchos
  ctx.fillStyle='#c9ced6';ctx.strokeStyle='#555';ctx.lineWidth=2;
  for(const q of spikes)for(let i=0;i<q.n;i++){const x=q.x+i*SP-cam;if(x<-40||x>W+10)continue;
    ctx.beginPath();ctx.moveTo(x,G);ctx.lineTo(x+SP/2,G-32);ctx.lineTo(x+SP,G);ctx.closePath();ctx.fill();ctx.stroke()}
  // pájaros, balas y plumas
  for(const bd of birds){if(!bd.alive)continue;const bx=bd.x-cam;if(bx<-60||bx>W+60)continue;
    const fl=Math.sin(bd.t*3);ctx.save();ctx.translate(bx,bd.y);ctx.scale(bd.f,1);
    ctx.fillStyle='#34344a';ctx.beginPath();ctx.ellipse(0,0,15,9,0,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(14,-4,7,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-27,-5);ctx.lineTo(-27,5);ctx.fill();
    ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(20,-6);ctx.lineTo(30,-3);ctx.lineTo(20,-1);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(16,-6,2.4,0,7);ctx.fill();
    ctx.fillStyle='#c1121f';ctx.beginPath();ctx.arc(16.6,-6,1.2,0,7);ctx.fill();
    ctx.strokeStyle='#c1121f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(12,-11);ctx.lineTo(19,-8);ctx.stroke();
    ctx.fillStyle='#4a4a66';ctx.beginPath();ctx.moveTo(-8,-2);ctx.lineTo(-20,-3-20*fl);ctx.lineTo(5,-4);ctx.fill();
    ctx.restore()}
  ctx.fillStyle='#ffd23f';for(const b of bullets)ctx.fillRect(b.x-cam-5,b.y-2,10,4);
  for(const u of puffs){ctx.globalAlpha=1-u.t/16;ctx.fillStyle='#ffe08a';
    for(let i=0;i<6;i++){const a=i*1.05+u.t*.05;ctx.beginPath();ctx.arc(u.x-cam+Math.cos(a)*u.t*2.2,u.y+Math.sin(a)*u.t*2.2,3,0,7);ctx.fill()}}
  ctx.globalAlpha=1;
  // meta
  const gx=GOAL-cam;ctx.fillStyle='#fff';ctx.fillRect(gx,G-90,4,90);
  ctx.fillStyle='#e63946';ctx.beginPath();ctx.moveTo(gx+4,G-90);ctx.lineTo(gx+44,G-74);ctx.lineTo(gx+4,G-58);ctx.fill();
  // muñeco (siempre al centro)
  const x=W/2,sw=Math.sin(p.t)*(p.air?0:1)*14,sp=p.air?12:0;
  const g=win>0?Math.min(1,(120-win)/20):0,hs=1+1.2*g,dead=dying>0,fall=dead?Math.min(1,(DYING-dying)/12):0;
  ctx.save();
  if(dead){ctx.translate(x,p.y-18*fall);ctx.rotate(p.dir*Math.PI/2*fall);ctx.translate(-x,-p.y)}
  ctx.strokeStyle='#222';ctx.lineWidth=5;ctx.lineCap='round';
  const hip=p.y-34,sh=p.y-(face?56:62);
  ctx.beginPath();
  ctx.moveTo(x,sh);ctx.lineTo(x,hip);                               // cuerpo
  ctx.moveTo(x,hip);ctx.lineTo(x+sw+sp,p.y);                        // pierna 1
  ctx.moveTo(x,hip);ctx.lineTo(x-sw-sp,p.y);                        // pierna 2
  ctx.moveTo(x,sh+4);ctx.lineTo(x-sw+(p.air?-14:0),sh+(p.air?-14:24)); // brazo 1
  ctx.moveTo(x,sh+4);ctx.lineTo(x+sw+(p.air?14:0),sh+(p.air?-14:24));  // brazo 2
  ctx.stroke();
  {const gx=x+p.dir*10,gy=sh+22;
    ctx.beginPath();ctx.moveTo(x,sh+6);ctx.lineTo(gx,gy);ctx.stroke();
    ctx.fillStyle='#222';ctx.fillRect(p.dir>0?gx-2:gx-20,gy-4,22,7);ctx.fillRect(p.dir>0?gx:gx-8,gy+2,7,9);
    if(flash>0){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(gx+p.dir*26,gy,7,0,7);ctx.fill()}}
  if(face&&face.cut){const hh=48,ww=hh*face.img.width/face.img.height,hy=sh-hh/2+5-(hs-1)*hh/2;
    ctx.save();ctx.translate(x,hy);ctx.rotate(p.air?Math.max(-.2,Math.min(.2,p.vy*.012))*p.dir:Math.sin(p.t)*.1);ctx.scale(hs,hs);
    ctx.drawImage(face.img,-ww/2,-hh/2,ww,hh);ctx.restore();
  }else if(face){const r=21,hy=sh-r+2-(hs-1)*r;
    ctx.save();ctx.translate(x,hy);ctx.rotate(p.air?Math.max(-.2,Math.min(.2,p.vy*.012))*p.dir:Math.sin(p.t)*.1);ctx.scale(hs,hs);
    ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.save();ctx.clip();ctx.drawImage(face.img,-r,-r,2*r,2*r);ctx.restore();
    ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();ctx.restore();
  }else{
    ctx.save();ctx.translate(x,sh-14-(hs-1)*15);ctx.scale(hs,hs);
    ctx.fillStyle='#ffcc99';ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.lineWidth=5/hs;ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(5*p.dir,-2,2.5,0,7);ctx.fill();ctx.restore();
  }
  ctx.restore();
  if(g>.3){const k2=Math.min(1,(g-.3)/.7);ctx.font=Math.round(26+30*k2)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign='center';ctx.fillText('👍',x+34+22*hs,sh-8-18*hs)}
  if(dead)bubble(PHRASE,x,190);
  else if(win>0)bubble(WINP,x,78);
  ctx.fillStyle=z2?'#fff':'#222';ctx.font='bold 16px system-ui,Arial';ctx.textAlign='left';
  ctx.fillText('Zona '+(z2?2:1)+' · Nivel '+(lvl+1)+'/'+LV.length+'   Intentos: '+deaths+'   Meta: '+Math.max(0,Math.round(GOAL-p.x))+' px',12,26);
  ctx.textAlign='center';ctx.font='bold 34px system-ui,Arial';
  if(msg>0)ctx.fillText(dmsg||'¡Pinchos! Reiniciando…',W/2,150);
  if(win>0)ctx.fillText(lvl===LV.length-1?'¡Juego completado!':'¡Nivel '+(lvl+1)+' completado!',W/2,50);
}
const menu=document.getElementById('menu'),mbtn=document.getElementById('mbtn'),fbtn=document.getElementById('fbtn');
let pfs=false;
function toggleFS(){
  const w=document.getElementById('wrap');
  if(pfs){pfs=false;document.body.classList.remove('fs');return}
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  const req=w.requestFullscreen||w.webkitRequestFullscreen;
  const fb=()=>{pfs=true;document.body.classList.add('fs')};
  if(!req){fb();return}
  try{const r=req.call(w);if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(fb)}catch(e){fb()}
}
fbtn.addEventListener('click',toggleFS);
addEventListener('keydown',e=>{if(e.code==='KeyF'&&!e.repeat)toggleFS()});
const B=(a,t,x='')=>`<button class="mb ${x}" data-a="${a}">${t}</button>`;
function openMenu(scr){
  inMenu=true;k.a=k.d=k.w=k.e=false;p.jumpReq=0;mbtn.classList.add('hidden');fbtn.classList.add('hidden');menu.classList.remove('hidden');
  if(scr==='levels'){
    let b='';for(let i=0;i<LV.length;i++)b+=i<=best?B('lv'+i,i+1,'sq'):`<button class="mb sq" disabled>🔒</button>`;
    menu.innerHTML='<h1>Niveles</h1><p>Completá un nivel para desbloquear el siguiente</p><div class="row">'+b+'</div>'+B('main','Volver');
  }else if(scr==='help'){
    menu.innerHTML='<h1>Cómo jugar</h1><p><b>A / D</b> o ◀ ▶: caminar</p><p><b>W</b>, Espacio o SALTO: saltar (¡dos veces en el aire!)</p><p><b>E</b> o 🔫: disparar a los pájaros</p><p>Los pinchos reinician el nivel. Las paredes altas necesitan doble salto.</p><p>Llegá a la bandera roja. <b>Esc</b> o ☰: menú · <b>F</b> o ⛶: pantalla completa</p>'+B('main','Volver');
  }else{
    menu.innerHTML='<h1>🧍 The Bafeva Game</h1>'+(note?'<p>'+note+'</p>':'')+(started?B('resume','Continuar')+B('restart','Reiniciar nivel'):'')+B('play',started?'Nuevo juego':'Jugar')+'<div class="row">'+B('levels','Niveles')+B('help','Cómo jugar')+B('snd','🔊 Sonido: '+(snd?'sí':'no'))+B('mus','🎵 Música: '+(musicOn?'sí':'no'))+B('fs','⛶ Pantalla completa')+B('padtgl','🎮 Botones: '+(padOn?'sí':'no'))+(face?B('nophoto','Quitar foto'):'')+(!face||!face.cut?B('mine','Mi cara'):'')+'</div>';
    note='';
  }
}
function closeMenu(){inMenu=false;p.jumpReq=0;menu.classList.add('hidden');mbtn.classList.remove('hidden');fbtn.classList.remove('hidden')}
function startLevel(i,fresh){lvl=i;load();if(fresh)deaths=0;started=true;win=0;msg=0;dying=0;closeMenu()}
menu.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.a;
  if(v==='play')startLevel(0,true);
  else if(v==='resume')closeMenu();
  else if(v==='restart')startLevel(lvl,false);
  else if(v.startsWith('lv'))startLevel(+v.slice(2),false);
  else if(v==='snd'){snd=!snd;try{localStorage.setItem('snd',snd?'1':'0')}catch(e){}if(snd)speak('Hola');openMenu('main')}
  else if(v==='fs')toggleFS();
  else if(v==='mus'){musicOn=!musicOn;try{localStorage.setItem('music',musicOn?'1':'0')}catch(e){}if(musicOn)musicStart();else musicStop();openMenu('main')}
  else if(v==='padtgl'){padOn=!padOn;try{localStorage.setItem('pad',padOn?'1':'0')}catch(e){}applyPad();openMenu('main')}
  else if(v==='photo')pic.click();
  else if(v==='nophoto'){face=null;try{localStorage.setItem('faceOff','1')}catch(e){}openMenu('main')}
  else if(v==='mine'){try{localStorage.removeItem('faceOff');localStorage.removeItem('faceCustom')}catch(e){}setFace(DEFAULT_FACE,true);setTimeout(()=>openMenu('main'),150)}
  else openMenu(v)});
const pic=document.getElementById('pic');
pic.addEventListener('change',()=>{const f=pic.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{setFace(r.result);note='📷 ¡Foto lista! Se usa como cara del personaje';setTimeout(()=>openMenu('main'),300)};
  r.readAsDataURL(f);pic.value=''});
mbtn.addEventListener('click',()=>openMenu('main'));
addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(inMenu){if(started)closeMenu()}else openMenu('main')}});
openMenu('main');
load();
let last=performance.now(),acc=0;
(function loop(t){
  acc+=Math.min(t-last,100);last=t;
  while(acc>=1000/60){update();acc-=1000/60}
  draw();requestAnimationFrame(loop)
})(last);
</script>
</body>
</html>
